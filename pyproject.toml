[project]
name = "piano-hand-assignment"
version = "0.1.0"
description = "Split piano MIDI into right-hand and left-hand tracks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "anime-song" }]
keywords = ["midi", "piano", "hand separation", "music information retrieval"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Sound/Audio :: MIDI",
]
dependencies = [
  "numpy>=1.24",
  "torch>=2.0",
  "mido>=1.2",
  "huggingface_hub>=0.20",
]

[project.optional-dependencies]
train = ["lxml>=4.9"]
api = ["fastapi>=0.100", "uvicorn>=0.23", "python-multipart>=0.0.6"]
dev = ["pytest>=7.0"]

[project.scripts]
pha-assign = "piano_hand_assignment.cli:main"
pha-serve = "piano_hand_assignment.api:main"

[project.urls]
Homepage = "https://github.com/anime-song/piano-hand-assignment"
Model = "https://huggingface.co/anime-song/piano-hand-assignment"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piano_hand_assignment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
